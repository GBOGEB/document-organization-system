<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gloob synchronized views</title>
<style>body{font-family:system-ui,sans-serif;margin:0;line-height:1.5}.shell{max-width:1280px;margin:auto;padding:24px}.bar{position:sticky;top:0;background:Canvas;padding:10px 0;border-bottom:1px solid ButtonBorder;z-index:2}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{border:1px solid ButtonBorder;border-radius:10px;padding:12px;margin:10px 0}.sel{outline:3px solid Highlight}.shared{border-style:dashed}.edge{font-family:monospace;white-space:pre-wrap}.timeline{border-left:2px solid ButtonBorder;padding-left:14px}select,button,a.btn{font:inherit;padding:6px 9px;border:1px solid ButtonBorder;border-radius:7px;background:Canvas;color:CanvasText;text-decoration:none}@media(max-width:850px){.grid{grid-template-columns:1fr}}</style></head>
<body><div class="shell"><div class="bar"><div class="row"><strong>Gloob synchronized views</strong><label>Book <select id="book"></select></label><label>Entry <select id="entry"></select></label><label>Depth <select id="profile"><option>compact</option><option selected>standard</option><option>deep</option></select></label><label>Provenance <select id="prov"><option>summary</option><option>evidence</option><option>runtime</option></select></label><a class="btn" href="./index.html">Gateway</a></div></div>
<div class="grid"><section><h1>Book</h1><div id="bookView"></div></section><section><h1>Graph</h1><div id="graphView"></div></section></div>
<section><h1>Selective provenance</h1><div id="provenance"></div></section><section><h1>Timeline</h1><div id="timeline" class="timeline"></div></section><section><h1>Runtime</h1><div id="runtime"></div></section></div>
<script>
const D={compact:1,standard:3,deep:5};let R,S,T,G,selected=null;
const e=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function rows(){let z=[];for(const b of R.books||[])for(const c of b.chapters||[])for(const n of c.entries||[])z.push({book:b,chapter:c,entry:n});return z}
function rec(){return rows().find(x=>x.book.slug===book.value&&x.entry.id===entry.value)}
function atoms(){const d=D[profile.value],w=new Set(G.shared_atom_refs||[]);return[...(G.atoms||[]).filter(a=>(a.min_depth||1)<=d).map(a=>({...a,scope:'LOCAL'})),...(S.atoms||[]).filter(a=>w.has(a.id)&&(a.min_depth||1)<=d).map(a=>({...a,scope:'SHARED'}))]}
function events(){const id=rec().entry.id;return(T.events||[]).filter(x=>(x.entry_ids||[]).includes('*')||(x.entry_ids||[]).includes(id)).sort((a,b)=>a.sequence-b.sequence)}
function choose(id){selected=id;render()}
function render(){const r=rec(),A=atoms();bookView.innerHTML=`<div class="card"><b>${e(r.entry.title)}</b><br><code>${e(r.entry.id)}</code></div>`+A.map(a=>`<button class="card ${a.scope==='SHARED'?'shared':''} ${selected===a.id?'sel':''}" data-id="${e(a.id)}"><b>${e(a.heading)}</b><br>${e(a.value)} ${e(a.unit||'')}<br><small>${e(a.id)} · ${e(a.scope)}</small></button>`).join('');
const N=[{id:r.book.id,t:'BOOK'},{id:r.chapter.id,t:'CHAPTER'},{id:r.entry.id,t:'ENTRY'},...A.map(a=>({id:a.id,t:a.scope==='SHARED'?'SHARED_ATOM':'ATOM'}))];graphView.innerHTML=N.map(n=>`<button class="card ${selected===n.id?'sel':''}" data-id="${e(n.id)}"><b>${e(n.t)}</b><br><code>${e(n.id)}</code></button>`).join('')+`<div class="card edge">${e([`${r.book.id} --CONTAINS--> ${r.chapter.id}`,`${r.chapter.id} --CONTAINS--> ${r.entry.id}`,...A.map(a=>`${r.entry.id} --HAS_ATOM--> ${a.id}`),...(G.edges||[]).map(x=>`${x.from} --${x.type}--> ${x.to}`)].join('\n'))}</div>`;
const level=prov.value;const src=(G.sources||[]).map(s=>level==='summary'?`<li><code>${e(s.id)}</code> · ${e(s.authority||'')}</li>`:`<li><code>${e(s.id)}</code> · ${e(s.authority||'')} · ${e(s.repo)}@<code>${e(s.commit||'')}</code>:${e(s.path||'')}</li>`).join('');const run=level==='runtime'?`<h3>Operators</h3><ul>${(G.operators||[]).map(o=>`<li><code>${e(o.id)}</code></li>`).join('')}</ul><h3>Runtime receipts</h3><ul>${events().map(x=>`<li>${e(x.version)} · run <code>${e(x.run_id)}</code> · <code>${e(x.sha)}</code></li>`).join('')}</ul>`:'';provenance.innerHTML=`<div class="card">Target <code>${e(selected||r.entry.id)}</code> · level <b>${e(level)}</b><h3>Sources</h3><ul>${src||'<li>None</li>'}</ul><h3>Shared lineage</h3><ul>${(G.shared_atom_refs||[]).map(x=>`<li><code>${e(x)}</code></li>`).join('')||'<li>None</li>'}</ul>${run}</div>`;
timeline.innerHTML=events().map(x=>`<article class="card"><b>${e(x.label)}</b><br>${e(x.kind)} · ${e(x.result)}<br><code>${e(x.sha)}</code><br>run <code>${e(x.run_id)}</code></article>`).join('');const E=events();runtime.innerHTML=`<div class="card"><h3>Observed proofs</h3>${E.filter(x=>x.kind==='RUNTIME_PROOF').map(x=>`<p><b>${e(x.result)}</b> · ${e(x.version)} · run <code>${e(x.run_id)}</code></p>`).join('')}<h3>Control promotions</h3>${E.filter(x=>x.kind==='PROMOTION').map(x=>`<p><b>CONTROL</b> · ${e(x.version)} · <code>${e(x.sha)}</code></p>`).join('')}<p><small>Runtime receipts prove publication/runtime behaviour only; they do not confer engineering acceptance.</small></p></div>`;document.querySelectorAll('[data-id]').forEach(x=>x.onclick=()=>choose(x.dataset.id))}
async function loadGraph(){const r=rec();G=await(await fetch('./'+r.entry.graph,{cache:'no-store'})).json();selected=null;render()}
function fillEntries(pref){const q=rows().filter(x=>x.book.slug===book.value);entry.innerHTML=q.map(x=>`<option value="${e(x.entry.id)}">${e(x.chapter.title)} / ${e(x.entry.title)}</option>`).join('');const p=q.find(x=>x.entry.slug===pref);if(p)entry.value=p.entry.id}
async function init(){[R,S,T]=await Promise.all(['./registry.yaml','./graph/shared-atoms.json','./control/timeline.json'].map(async p=>await(await fetch(p,{cache:'no-store'})).json()));const q=new URLSearchParams(location.search);book.innerHTML=(R.books||[]).map(x=>`<option value="${e(x.slug)}">${e(x.title)}</option>`).join('');if((R.books||[]).some(x=>x.slug===q.get('book')))book.value=q.get('book');fillEntries(q.get('entry'));if(D[q.get('profile')])profile.value=q.get('profile');await loadGraph()}
book.onchange=()=>{fillEntries();loadGraph()};entry.onchange=loadGraph;profile.onchange=render;prov.onchange=render;init();
</script></body></html>
