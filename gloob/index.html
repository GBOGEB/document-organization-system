<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Gloob Library</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui,-apple-system,Segoe UI,sans-serif; }
    body { margin: 0; line-height: 1.55; }
    .shell { max-width: 1180px; margin: 0 auto; padding: 28px 22px 60px; }
    header { position: sticky; top: 0; backdrop-filter: blur(14px); padding: 14px 0; z-index: 2; border-bottom: 1px solid color-mix(in srgb,currentColor 18%,transparent); }
    .top { display:flex; gap:14px; align-items:center; justify-content:space-between; flex-wrap:wrap; }
    .controls { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
    select,button { font: inherit; padding: 7px 10px; border-radius: 8px; border: 1px solid color-mix(in srgb,currentColor 28%,transparent); background: transparent; color: inherit; }
    code { overflow-wrap:anywhere; }
    .crumbs { opacity:.72; margin:.3rem 0 1rem; }
    .atom { border:1px solid color-mix(in srgb,currentColor 20%,transparent); border-radius:12px; padding:16px 18px; margin:12px 0; scroll-margin-top:145px; }
    .atom h3 { margin:.1rem 0 .45rem; display:flex; gap:8px; align-items:baseline; flex-wrap:wrap; }
    .atom small { opacity:.62; }
    .meta { opacity:.72; }
    .shared { border-style:dashed; }
    table { width:100%; border-collapse:collapse; margin-top:12px; }
    th,td { text-align:left; vertical-align:top; border:1px solid color-mix(in srgb,currentColor 20%,transparent); padding:8px; }
    .hidden { display:none; }
    .pill { display:inline-block; border:1px solid color-mix(in srgb,currentColor 22%,transparent); border-radius:999px; padding:2px 8px; font-size:.85rem; opacity:.78; }
    nav a { margin-right:10px; }
    .refs { padding-left: 1.2rem; }
    @media print { header,.controls,nav { display:none; } .shell { max-width:none; padding:0; } .atom { break-inside:avoid; } }
  </style>
</head>
<body>
<div class="shell">
  <header>
    <div class="top">
      <div><strong>Gloob Library</strong> <span class="pill" id="profilePill">standard</span></div>
      <div class="controls">
        <label>Book <select id="book"></select></label>
        <label>Entry <select id="entry"></select></label>
        <label>Depth
          <select id="profile">
            <option value="compact">compact</option>
            <option value="standard" selected>standard</option>
            <option value="deep">deep</option>
          </select>
        </label>
        <button id="sourcesBtn" type="button">Sources</button>
        <button id="copyBtn" type="button">Copy entry link</button>
      </div>
    </div>
  </header>

  <main id="app" aria-live="polite"><p>Loading Gloob registry...</p></main>
</div>

<script>
const PROFILE_DEPTH = {compact:1, standard:3, deep:5};
let registry = null;
let graph = null;
let sharedCatalog = null;
let showSources = false;

const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const atomText = atom => {
  const base = atom.unit ? `${atom.value} ${atom.unit}` : String(atom.value ?? '');
  return atom.note ? `${base} — ${atom.note}` : base;
};

function allEntries() {
  const rows = [];
  for (const book of registry?.books || []) {
    for (const chapter of book.chapters || []) {
      for (const entry of chapter.entries || []) rows.push({book, chapter, entry});
    }
  }
  return rows;
}

function selectedRecord() {
  const bookSlug = document.getElementById('book').value;
  const entryId = document.getElementById('entry').value;
  return allEntries().find(r => r.book.slug === bookSlug && r.entry.id === entryId) || null;
}

function canonicalEntryUrl() {
  const record = selectedRecord();
  const u = new URL(location.href);
  if (record) {
    u.searchParams.set('book', record.book.slug);
    u.searchParams.set('entry', record.entry.slug);
  }
  u.searchParams.set('profile', document.getElementById('profile').value);
  u.hash = graph?.entry?.slug || '';
  return u.toString();
}

function populateBooks(preferredSlug) {
  const bookSelect = document.getElementById('book');
  bookSelect.innerHTML = (registry.books || []).map(b => `<option value="${esc(b.slug)}">${esc(b.title)}</option>`).join('');
  if ((registry.books || []).some(b => b.slug === preferredSlug)) bookSelect.value = preferredSlug;
}

function populateEntries(preferredSlug) {
  const bookSlug = document.getElementById('book').value;
  const rows = allEntries().filter(r => r.book.slug === bookSlug);
  const entrySelect = document.getElementById('entry');
  entrySelect.innerHTML = rows.map(r => `<option value="${esc(r.entry.id)}">${esc(r.chapter.title)} / ${esc(r.entry.title)}</option>`).join('');
  const preferred = rows.find(r => r.entry.slug === preferredSlug);
  if (preferred) entrySelect.value = preferred.entry.id;
}

function sharedAtomsForGraph(depth) {
  const wanted = new Set(graph?.shared_atom_refs || []);
  return (sharedCatalog?.atoms || []).filter(a => wanted.has(a.id) && Number(a.min_depth || 1) <= depth);
}

function crossBookRefs(record) {
  return (registry?.cross_book_references || []).filter(r => r.from_entry === record.entry.id || r.to_entry === record.entry.id);
}

function linkForEntryId(entryId) {
  const target = allEntries().find(r => r.entry.id === entryId);
  if (!target) return '#';
  const u = new URL(location.href);
  u.search = '';
  u.hash = '';
  u.searchParams.set('book', target.book.slug);
  u.searchParams.set('entry', target.entry.slug);
  u.searchParams.set('profile', document.getElementById('profile').value);
  return u.toString();
}

function render() {
  if (!graph || !registry) return;
  const record = selectedRecord();
  if (!record) return;
  const profile = document.getElementById('profile').value;
  const depth = PROFILE_DEPTH[profile];
  document.getElementById('profilePill').textContent = `${profile} · d${depth}`;

  const atoms = (graph.atoms || []).filter(a => Number(a.min_depth) <= depth);
  const sharedAtoms = sharedAtomsForGraph(depth);
  const nav = [...atoms, ...sharedAtoms].map(a => `<a href="#${esc(a.slug)}">${esc(a.slug)}</a>`).join('');
  const cards = atoms.map(a => `
    <section class="atom" id="${esc(a.slug)}" data-id="${esc(a.id)}">
      <h3>${esc(a.heading)} <a href="#${esc(a.slug)}" aria-label="Link to ${esc(a.heading)}">#</a></h3>
      <p>${esc(atomText(a))}</p>
      <small>${esc(a.id)} · slug <code>${esc(a.slug)}</code> · minimum depth ${esc(a.min_depth)}</small>
    </section>`).join('');
  const sharedCards = sharedAtoms.map(a => `
    <section class="atom shared" id="${esc(a.slug)}" data-id="${esc(a.id)}">
      <h3>${esc(a.heading)} <span class="pill">shared</span> <a href="#${esc(a.slug)}">#</a></h3>
      <p>${esc(atomText(a))}</p>
      <small>${esc(a.id)} · canonical shared Atom · minimum depth ${esc(a.min_depth || 1)}</small>
    </section>`).join('');

  const sources = (graph.sources || []).map(s => `
    <tr><td><code>${esc(s.id)}</code></td><td>${esc(s.repo)}</td><td><code>${esc(s.commit || '')}</code></td><td><code>${esc(s.path || '')}</code></td><td>${esc(s.authority || '')}</td></tr>`).join('');

  const refs = crossBookRefs(record).map(r => {
    const other = r.from_entry === record.entry.id ? r.to_entry : r.from_entry;
    return `<li><code>${esc(r.type)}</code> via <code>${esc(r.via_atom || '')}</code> → <a href="${esc(linkForEntryId(other))}"><code>${esc(other)}</code></a></li>`;
  }).join('');

  document.getElementById('app').innerHTML = `
    <h1>${esc(record.book.title)}</h1>
    <div class="crumbs"><code>${esc(record.entry.address)}</code></div>
    <h2>${esc(record.chapter.title)}</h2>
    <section class="atom" id="${esc(graph.entry.slug)}">
      <h2>${esc(graph.entry.title)} <a href="#${esc(graph.entry.slug)}">#</a></h2>
      <p class="meta">Immutable ID <code>${esc(graph.entry.id)}</code> · slug <code>${esc(graph.entry.slug)}</code> · profile <b>${esc(profile)}</b> · depth ${depth}</p>
      <nav>${nav}</nav>
    </section>
    ${cards}
    ${sharedCards}
    ${refs ? `<section><h2>Cross-Book references</h2><ul class="refs">${refs}</ul></section>` : ''}
    <section id="sources" class="${showSources ? '' : 'hidden'}">
      <h2>Source bindings</h2>
      <p class="meta">Sources retain their own authority. The Book federates them; it does not silently promote receipt evidence into engineering acceptance.</p>
      ${sources ? `<table><thead><tr><th>ID</th><th>Repo</th><th>Commit</th><th>Path</th><th>Authority</th></tr></thead><tbody>${sources}</tbody></table>` : '<p>No entry-local sources declared.</p>'}
    </section>`;

  if (location.hash) requestAnimationFrame(() => document.getElementById(location.hash.slice(1))?.scrollIntoView({block:'start'}));
}

function syncRoute(replace = true) {
  const record = selectedRecord();
  if (!record) return;
  const u = new URL(location.href);
  u.searchParams.set('book', record.book.slug);
  u.searchParams.set('entry', record.entry.slug);
  u.searchParams.set('profile', document.getElementById('profile').value);
  if (replace) history.replaceState({}, '', u);
  else history.pushState({}, '', u);
}

async function loadSelectedGraph() {
  const record = selectedRecord();
  if (!record) throw new Error('no registry entry selected');
  const response = await fetch(`./${record.entry.graph}`, {cache:'no-store'});
  if (!response.ok) throw new Error(`graph fetch failed: ${response.status}`);
  graph = await response.json();
  syncRoute(true);
  render();
}

async function init() {
  try {
    const [registryResponse, sharedResponse] = await Promise.all([
      fetch('./registry.yaml', {cache:'no-store'}),
      fetch('./graph/shared-atoms.json', {cache:'no-store'})
    ]);
    if (!registryResponse.ok) throw new Error(`registry fetch failed: ${registryResponse.status}`);
    if (!sharedResponse.ok) throw new Error(`shared Atom fetch failed: ${sharedResponse.status}`);
    registry = await registryResponse.json();
    sharedCatalog = await sharedResponse.json();

    const params = new URLSearchParams(location.search);
    populateBooks(params.get('book'));
    populateEntries(params.get('entry'));
    const requestedProfile = params.get('profile');
    if (PROFILE_DEPTH[requestedProfile]) document.getElementById('profile').value = requestedProfile;
    await loadSelectedGraph();
  } catch (err) {
    document.getElementById('app').innerHTML = `<h1>Gloob Library</h1><p>Unable to load registry or graph.</p><pre>${esc(err)}</pre>`;
  }
}

document.getElementById('book').addEventListener('change', async () => { populateEntries(null); location.hash = ''; await loadSelectedGraph(); });
document.getElementById('entry').addEventListener('change', async () => { location.hash = ''; await loadSelectedGraph(); });
document.getElementById('profile').addEventListener('change', () => { syncRoute(true); render(); });
document.getElementById('sourcesBtn').addEventListener('click', () => { showSources = !showSources; render(); });
document.getElementById('copyBtn').addEventListener('click', async () => {
  if (!graph) return;
  const text = canonicalEntryUrl();
  try { await navigator.clipboard.writeText(text); document.getElementById('copyBtn').textContent = 'Copied'; }
  catch { document.getElementById('copyBtn').textContent = text; }
});
window.addEventListener('popstate', () => location.reload());

init();
</script>
</body>
</html>
