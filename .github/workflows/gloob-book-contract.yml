name: Gloob Book Contract

on:
  pull_request:
    paths:
      - "gloob/**"
      - ".github/workflows/gloob-book-contract.yml"
  push:
    branches: [main]
    paths:
      - "gloob/**"
      - ".github/workflows/gloob-book-contract.yml"

permissions:
  contents: read
  actions: read

jobs:
  contract:
    runs-on: ubuntu-latest
    env:
      CONTROL_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run contract tests
        run: python -m unittest discover -s gloob/tests -p "test_*.py"
      - name: Render all profiles
        run: python gloob/render_book.py --all-profiles
      - name: Emit measured control receipts
        run: python gloob/emit_control_receipts.py
      - name: Federate prior receipts
        run: python gloob/federate_receipts.py --limit 8
      - name: Analyze recursive control
        run: python gloob/recursive_control.py gloob/control/generated/federated-history.json --capacity 2
      - name: Reverse-load residual components
        run: python gloob/residual_burndown.py
      - name: Run guarded control surveillance
        run: python gloob/control_surveillance.py gloob/control/generated/federated-history.json --capacity 2
      - name: Attribute change and route causes
        run: python gloob/causal_routing.py gloob/control/generated/federated-history.json gloob/control/generated/control-surveillance.json
      - name: Emit external causal handshakes
        run: python gloob/external_causal_return.py gloob/control/generated/causal-route-plan.json
      - name: Federate external causal returns
        run: python gloob/federate_external_returns.py gloob/control/generated/external-handshake-plan.json
      - name: Close or requalify causal routes
        run: python gloob/external_causal_return.py gloob/control/generated/causal-route-plan.json --federated-returns gloob/control/generated/federated-external-returns.json
      - name: Verify artifacts exist
        run: |
          test -f gloob/examples/qplant-energy-lkt-invcop-compact.html
          test -f gloob/examples/qplant-energy-lkt-invcop-standard.md
          test -f gloob/examples/qplant-energy-lkt-invcop-deep.pdf
          test -f gloob/examples/qplant-energy-lkt-invcop-deep.receipt.json
          test -f gloob/control/generated/measured-telemetry.json
          test -f gloob/control/generated/causal-fingerprint.json
          test -f gloob/control/generated/pca-priority.json
          test -f gloob/control/generated/rebuild-shared-authority.json
          test -f gloob/control/generated/worker-plan.json
          test -f gloob/control/generated/federated-history.json
          test -f gloob/control/generated/recursive-control.json
          test -f gloob/control/generated/residual-worker-plan.json
          test -f gloob/control/generated/residual-burndown.json
          test -f gloob/control/generated/control-surveillance.json
          test -f gloob/control/generated/residual-discovery.json
          test -f gloob/control/generated/control-escalation-plan.json
          test -f gloob/control/generated/causal-attribution.json
          test -f gloob/control/generated/causal-route-plan.json
          test -f gloob/control/generated/external-handshake-plan.json
          test -f gloob/control/generated/federated-external-returns.json
          test -f gloob/control/generated/external-return-ledger.json
          test -f gloob/control/generated/route-closure-plan.json
          python -c 'import json,os; r=json.load(open("gloob/control/generated/measured-telemetry.json"))["receipt"]; assert r["source_commit"] == os.environ["CONTROL_SOURCE_SHA"]'
          python -c 'import json; h=json.load(open("gloob/control/generated/federated-history.json")); print("history",h["snapshot_count"],h.get("external_return_snapshot_count",0),h["download_errors"]); assert h["snapshot_count"] >= 3 and len(set(h["distinct_source_commits"])) >= 3'
          python -c 'import json; s=json.load(open("gloob/control/generated/control-surveillance.json")); print("surveillance",s["counts"]); assert s["state"] == "SURVEILLING" and s["counts"]["ESCALATE"] == 0 and s["counts"]["REQUALIFY"] == 0'
          python -c 'import json; a=json.load(open("gloob/control/generated/causal-attribution.json")); print("causal",a["counts"]); assert a["state"] == "ATTRIBUTED" and a["counts"]["CAUSAL_ESCALATE"] == 0 and a["counts"]["CAUSAL_REQUALIFY"] == 0'
          python -c 'import json; p=json.load(open("gloob/control/generated/causal-route-plan.json")); print("routes",len(p["assignments"])); assert p["mode"] == "CAUSE_BOUND_HANDSHAKE_REQUIRED" and not p["assignments"] and not p["blocked_unattributed"]'
          python -c 'import json; h=json.load(open("gloob/control/generated/external-handshake-plan.json")); f=json.load(open("gloob/control/generated/federated-external-returns.json")); l=json.load(open("gloob/control/generated/external-return-ledger.json")); c=json.load(open("gloob/control/generated/route-closure-plan.json")); print("external",len(h["handshakes"]),f["state"],l["counts"]); assert not h["handshakes"]; assert f["state"] == "NO_OPEN_HANDSHAKES"; assert l["handshake_count"] == 0 and l["return_count"] == 0; assert not c["requalify"] and not c["keep_open"] and not c["triage"]'
      - name: Upload control receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gloob-control-receipts
          path: gloob/control/generated/*.json
          if-no-files-found: error
